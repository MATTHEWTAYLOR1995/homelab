services:
  homelab-lan-proxy:
    image: nginx:alpine
    container_name: homelab-lan-proxy
    restart: unless-stopped
    ports:
      - "192.168.1.109:3001:80"
      - "192.168.1.109:3002:81"
      - "192.168.1.109:3003:82"
      - "192.168.1.109:3004:83"
    volumes:
      - ./lan-proxy/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./lan-proxy/certs:/etc/nginx/certs:ro
