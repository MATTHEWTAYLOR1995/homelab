name: build-image-drink-deals

on:
  push:
    branches: [main]
    paths:
      - "apps/drink-deals/**"
      - ".github/workflows/build_drink_deals.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./apps/drink-deals
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/matthewtaylor1995/drink-deals:${{ github.sha }}
            ghcr.io/matthewtaylor1995/drink-deals:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
