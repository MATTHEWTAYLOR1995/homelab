name: build-image-garmin
 
on:
  push:
    branches: [main]
    # Only rebuild when the site code (or this workflow) changes. Without this,
    # bumping the image tag in apps/charlton/ would trigger another build.
    paths:
      - "apps/garmin/**"
      - ".github/workflows/build_garmin.yml"
  workflow_dispatch:
 
permissions:
  contents: read
  packages: write
 
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
 
      - uses: docker/setup-buildx-action@v3
 
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
 
      - uses: docker/build-push-action@v6
        with:
          context: ./apps/garmin
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/matthewtaylor1995/garmin:${{ github.sha }}
            ghcr.io/matthewtaylor1995/garmin:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
 