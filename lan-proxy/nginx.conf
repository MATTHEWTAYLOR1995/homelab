events {}

http {
  server {
    listen 80;
    location / {
      proxy_pass http://192.168.1.109:8080;
      proxy_set_header Host charlton.localhost;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }

  server {
    listen 81;
    location / {
      proxy_pass http://192.168.1.109:8080;
      proxy_set_header Host garmin.localhost;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }

  server {
    listen 82 ssl;
    server_name _;
    ssl_certificate /etc/nginx/certs/argocd.crt;
    ssl_certificate_key /etc/nginx/certs/argocd.key;

    location / {
      proxy_pass http://192.168.1.109:8080;
      proxy_http_version 1.1;
      proxy_set_header Host argocd.localhost;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_buffering off;
    }
  }

  server {
    listen 83;
    location / {
      proxy_pass http://192.168.1.109:8080;
      proxy_http_version 1.1;
      proxy_set_header Host home-assistant.localhost;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      # The Home Assistant UI talks over a WebSocket
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_buffering off;
      proxy_read_timeout 3600s;
    }
  }
}
