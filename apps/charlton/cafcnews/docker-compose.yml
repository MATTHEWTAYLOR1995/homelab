services:
  da3s-charlton-news:
    build: .
    container_name: da3s-charlton-news
    ports:
      - "3000:3000"
    volumes:
      # Mount the data folder so you can edit the JSON files on the host
      # and see changes reflected on refresh, without rebuilding the image.
      - ./data:/app/data
    restart: unless-stopped
