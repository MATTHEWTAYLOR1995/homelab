apiVersion: v1
kind: ConfigMap
metadata:
  name: home-assistant-seed
  namespace: home-assistant
data:
  # Seed config. The init container copies this onto the PVC only if
  # /config/configuration.yaml does not exist yet. After first start the file on
  # the PVC is the source of truth, so editing this ConfigMap does not change a
  # running instance.
  configuration.yaml: |
    default_config:

    # Home Assistant rejects requests that arrive through a reverse proxy unless
    # the proxy is trusted. Traffic reaches it via Traefik, which runs as a pod on
    # the k3s pod network (10.42.0.0/16 by default).
    http:
      use_x_forwarded_for: true
      trusted_proxies:
        - 127.0.0.1
        - 10.42.0.0/16

    automation: !include automations.yaml
    script: !include scripts.yaml
    scene: !include scenes.yaml
