apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: home-assistant
resources:
  - configmap.yaml
  - deployment.yaml
  - pvc.yaml
  - service.yaml
  - ingress.yaml
images:
  - name: ghcr.io/home-assistant/home-assistant
    # Pin to a release (for example 2026.10.0) once it is working, so upgrades
    # are a deliberate commit rather than whatever "stable" points at.
    newTag: stable
