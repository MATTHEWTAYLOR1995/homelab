<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>{% block title %}Cycling Dashboard{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
</head>
<body>
<header class="topbar">
  <div class="topbar-row">
    <div class="brand">
      <svg class="brand-mark" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
        <circle cx="6" cy="17" r="3.4"/><circle cx="18" cy="17" r="3.4"/>
        <path d="M6 17 10 7h4M10 7l4 10M14 7h3M9.2 17h8.8"/>
      </svg>
      <span>Ride<span class="brand-accent">Cast</span></span>
    </div>
    <form action="{{ url_for('refresh') }}" method="post">
      <button type="submit" class="refresh-btn">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 3v6h-6"/></svg>
        Sync
      </button>
    </form>
  </div>
  <nav>
    <a href="{{ url_for('dashboard') }}" class="{{ 'active' if request.path == url_for('dashboard') }}">Overview</a>
    <a href="{{ url_for('week') }}" class="{{ 'active' if request.path == url_for('week') }}">This week</a>
    <a href="{{ url_for('improvement') }}" class="{{ 'active' if request.path == url_for('improvement') }}">Improvement</a>
  </nav>
</header>
<main class="content">
  <p class="data-mode">
    <span class="live-dot {{ 'is-live' if 'live' in mode else '' }}"></span>
    {{ mode }}{% if last_updated %} · synced {{ last_updated }}{% endif %}
  </p>
  {% block content %}{% endblock %}
</main>
<script>
(function () {
  const renderedAt = {{ last_updated | tojson }};
  async function checkForUpdate() {
    try {
      const res = await fetch('/api/last-updated');
      if (!res.ok) return;
      const data = await res.json();
      if (data.last_updated && data.last_updated !== renderedAt) {
        location.reload();
      }
    } catch (e) {}
  }
  setInterval(checkForUpdate, 60000);
})();
</script>
</body>
</html>
