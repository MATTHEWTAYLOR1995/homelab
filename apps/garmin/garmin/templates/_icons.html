{% macro icon(name, size=20) %}
{%- if name == "moon" -%}
<svg width="{{ size }}" height="{{ size }}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12.6A8.4 8.4 0 1 1 11.4 4.2a6.6 6.6 0 0 0 8.6 8.4Z"/></svg>
{%- elif name == "leaf" -%}
<svg width="{{ size }}" height="{{ size }}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 19c9 0 14-5 14-14 0 0-9 0-13 4-3.5 3.3-3.3 7.9-1 10Z"/><path d="M5 19c.3-4 2.3-7.6 6-9.6"/></svg>
{%- elif name == "wave" -%}
<svg width="{{ size }}" height="{{ size }}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12c2-3 4-3 6 0s4 3 6 0 4-3 6 0"/><path d="M2 17c2-3 4-3 6 0s4 3 6 0 4-3 6 0"/></svg>
{%- elif name == "arrow_up_right" -%}
<svg width="{{ size }}" height="{{ size }}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7"/><path d="M9 7h8v8"/></svg>
{%- elif name == "target" -%}
<svg width="{{ size }}" height="{{ size }}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="4.2"/><circle cx="12" cy="12" r="0.8" fill="currentColor" stroke="none"/></svg>
{%- elif name == "mountain" -%}
<svg width="{{ size }}" height="{{ size }}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"><path d="M3 19h18L14 6l-3.2 5-2.3-2Z"/></svg>
{%- elif name == "bolt" -%}
<svg width="{{ size }}" height="{{ size }}" viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M12 2 4 14h6l-1 8 9-13h-6Z"/></svg>
{%- else -%}
<svg width="{{ size }}" height="{{ size }}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="8"/></svg>
{%- endif -%}
{% endmacro %}
